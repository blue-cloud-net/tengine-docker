
user  nginx;

worker_processes  auto;
worker_cpu_affinity auto;
# worker_rlimit_nofile 1048576;

error_log  "pipe:rollback /var/log/nginx/error.log baknum=10 maxsize=300M interval=1d adjust=600" notice;

# pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  "pipe:rollback /var/log/nginx/access.log interval=1d baknum=30 maxsize=20M" main buffer=512k flush=1m;
    #access_log  "pipe:rollback logs/access_log interval=1d baknum=7 maxsize=2G"  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
