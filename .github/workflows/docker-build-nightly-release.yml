name: Build Docker Images

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        os: [ubuntu, debian, alpine]
        args: [slim, normal]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: !(matrix.os == 'ubuntu' && matrix.args == 'normal')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./mainline/${{ matrix.os }}-${{ matrix.args }}/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tengine:${{ matrix.os }}-${{ matrix.args }}-nightly

      # 如果matrix.os是ubuntu，发布nightly的tag
      - name: Build and push Docker image(main tag)
        if: matrix.os == 'ubuntu' && matrix.args == 'normal'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./mainline/${{ matrix.os }}-${{ matrix.args }}/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker push ghcr.io/${{ github.repository_owner }}/tengine:nightly

  build-dev:
    runs-on: ubuntu-latest  

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image for lua
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./mainline/debian-lua/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker push ghcr.io/${{ github.repository_owner }}/tengine:debian-lua-dev

      - name: Build and push Docker image for all
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./mainline/debian-all/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker push ghcr.io/${{ github.repository_owner }}/tengine:debian-all-dev
